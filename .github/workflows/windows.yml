name: Windows Native

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: pwsh
        run: |
          $env:MOONBIT_INSTALL_VERSION = (Get-Content .moonbit-toolchain -Raw).Trim()
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
      - name: Add MoonBit to PATH
        shell: pwsh
        run: |
          "$HOME\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Show tool versions
        shell: pwsh
        run: |
          $versions = moon version --all
          $versions
          $compiler = (Get-Content .moonbit-toolchain -Raw).Trim()
          $cli = (Get-Content .moon-version -Raw).Trim()
          if (-not ($versions | Select-String -SimpleMatch "moonc v$compiler (")) {
            throw "MoonBit compiler $compiler is required"
          }
          if (-not ($versions | Select-String -SimpleMatch "moon $cli (")) {
            throw "MoonBit CLI $cli is required"
          }
      - name: Update MoonBit registry
        shell: pwsh
        run: moon update
      - name: Install MoonBit dependencies
        shell: pwsh
        run: moon install
      - name: Check formatting and exported interfaces
        shell: pwsh
        run: |
          moon fmt --check
          moon info --target native
          git diff --exit-code --ignore-blank-lines
      - name: Run WebView2 tests and smoke
        shell: pwsh
        run: .\\scripts\\test-windows.ps1
